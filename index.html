
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دستیار آموزشی شهد</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f6f9;
      color: #243247;
    }
    header {
      background: white;
      padding: 24px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    header h1 { margin: 0 0 10px; }
    header p { margin: 0; color: #586579; }
    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }
    .panel {
      background: white;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      line-height: 2;
      box-shadow: 0 2px 10px #00000010;
    }
    .chat-button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: #1769aa;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 17px;
    }
    .chat-button:hover { background: #10558c; }
  </style>
</head>
<body>
  <header>
    <h1>دستیار آموزشی شهد</h1>
    <p>راهنمای استفاده از نرم‌افزار شهد</p>
  </header>
  <main>
    <section class="panel">
      <h2>به دستیار آموزشی شهد خوش آمدید</h2>
      <p>برای دریافت راهنمایی دربارهٔ نرم‌افزار شهد، روی دکمهٔ زیر کلیک کنید. هنگام پرسیدن سؤال، مشخص کنید که سؤال شما مربوط به نرم‌افزار شهد است.</p>
      <a class="chat-button"
         href="https://www.chatbase.co/chatbot-iframe/_tko6PdjkMLf2Ml82UvxQ"
         target="_blank"
         rel="noopener noreferrer">
        گفت‌وگو با دستیار شهد
      </a>
    </section>
  </main>
</body>
</html>
